name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'          # Đảm bảo đây là bản 21
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven (Skip Tests)
      run: mvn clean install -DskipTests

      # CD
  deploy-and-release:
    needs: build-and-test       # Chỉ chạy CD nếu vòng CI ở trên chạy thành công
    if: startsWith(github.ref, 'refs/tags/') # Chỉ chạy khi bạn tạo tag v...
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Cấp quyền cho GitHub Actions tạo bản Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Đóng gói ứng dụng thành file .jar
    - name: Package Application
      run: mvn clean package -DskipTests

    # Tự động tạo bản Release trên GitHub và đính kèm file sản phẩm .jar
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          auction-server/target/*.jar
          auction-client/target/*.jar
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        draft: false
        prerelease: false