name: Java CI with Maven

# Kích hoạt workflow khi có commit push lên nhánh main/master hoặc khi tạo Pull Request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Khởi tạo mã nguồn từ kho chứa GitHub xuống server build
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Thiết lập môi trường Java JDK 17 (hoặc phiên bản nhóm bạn đang dùng)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Bước 3: Biên dịch mã nguồn và chạy toàn bộ Unit Test (JUnit)
    - name: Build and Run Tests with Maven
      run: mvn clean test